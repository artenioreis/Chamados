<div class="card h-100 border-0 shadow-sm transition-hover" 
     style="border-left: 5px solid {% if ticket.priority == 'alta' %}var(--danger){% elif ticket.priority == 'media' %}var(--warning){% else %}var(--info){% endif %} !important;">
    <div class="card-body p-3">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="badge rounded-pill bg-light text-muted border">#{{ ticket.id }}</span>
            <span class="badge rounded-pill 
                {% if ticket.status == 'Aberto' %} bg-primary
                {% elif ticket.status == 'Em Atendimento' %} bg-secondary
                {% elif ticket.status == 'Resolvido' %} bg-success
                {% else %} bg-dark
                {% endif %}">
                {{ ticket.status }}
            </span>
        </div>
        
        <h6 class="card-title fw-bold mb-3">{{ ticket.title }}</h6>
        
        <div class="d-flex align-items-center text-muted small mb-2">
            <i class="fas fa-exchange-alt me-2 text-primary"></i>
            <span>{{ ticket.origin_sector }} <i class="fas fa-arrow-right mx-1 text-xs"></i> {{ ticket.target_sector }}</span>
        </div>

        <div class="d-flex align-items-center text-muted small mb-3">
            <i class="fas fa-user-edit me-2"></i>
            <span>{{ ticket.author.name }}</span>
        </div>

        <div class="d-flex justify-content-between align-items-center pt-2 border-top mt-auto">
            <div class="text-muted small">
                <i class="far fa-clock me-1"></i> {{ ticket.created_at | localdatetime('%d/%m %H:%M') }}
            </div>
            <a href="{{ url_for('main.view_ticket', ticket_id=ticket.id) }}" class="btn btn-sm btn-link text-primary p-0 fw-bold">Ver mais</a>
        </div>
        
        {% if ticket.assignee_user %}
            <div class="mt-2 pt-2 border-top-dashed d-flex align-items-center">
                <div class="avatar-sm me-2 bg-primary-subtle rounded-circle d-flex align-items-center justify-content-center" style="width: 24px; height: 24px;">
                    <i class="fas fa-user-tie text-primary" style="font-size: 10px;"></i>
                </div>
                <span class="text-xs text-muted">{{ ticket.assignee_user.name }}</span>
            </div>
        {% endif %}
    </div>
</div>
