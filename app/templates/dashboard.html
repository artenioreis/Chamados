{% extends "base.html" %}
{% block content %}
    <div class="row align-items-center mb-5 mt-4">
        <div class="col-md-8">
            <h1 class="display-5 fw-bold text-gradient mb-2">Painel de Controle</h1>
            <p class="text-muted fs-5">Insights em tempo real do seu sistema de suporte.</p>
        </div>
        <div class="col-md-4 text-md-end d-none d-md-block">
            <img src="{% if system_settings and system_settings.logo_filename %}{{ url_for('static', filename='uploads/' + system_settings.logo_filename) }}{% else %}https://neosul.com.br/clientes/1/img/logo.png{% endif %}" alt="Logo" class="brand-logo mb-0">
        </div>
    </div>

    <div class="dashboard-grid">
        <!-- KPI Principal -->
        <div class="card metric-card animate-fade-in" style="grid-column: span 1;">
            <i class="fas fa-ticket-alt"></i>
            <h6 class="text-muted text-uppercase small fw-bold">Chamados Totais</h6>
            <h2 class="display-4 fw-bold mb-0">{{ total_tickets }}</h2>
            <div class="mt-2">
                <span class="badge bg-soft-primary text-primary">Ativos agora</span>
            </div>
        </div>

        <!-- Gráfico de Status -->
        <div class="card p-3 shadow-sm animate-fade-in" style="grid-column: span 2;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="mb-0 fw-bold"><i class="fas fa-tasks me-2 text-primary"></i>Distribuição por Status</h6>
            </div>
            <div style="height: 250px;">
                <canvas id="statusChart" data-chartdata="{{ status_data }}"></canvas>
            </div>
        </div>

        <!-- Gráfico de Setor -->
        <div class="card p-3 shadow-sm animate-fade-in" style="grid-column: span 1;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="mb-0 fw-bold"><i class="fas fa-building me-2 text-success"></i>Por Setor</h6>
            </div>
            <div style="height: 250px;">
                <canvas id="sectorChart" data-chartdata="{{ sector_data }}"></canvas>
            </div>
        </div>

        <!-- Gráfico de Prioridade -->
        <div class="card p-3 shadow-sm animate-fade-in" style="grid-column: span 2;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="mb-0 fw-bold"><i class="fas fa-exclamation-triangle me-2 text-warning"></i>Nível de Prioridade</h6>
            </div>
            <div style="height: 250px;">
                <canvas id="priorityChart" data-chartdata="{{ priority_data }}"></canvas>
            </div>
        </div>
    </div>
{% endblock content %}
